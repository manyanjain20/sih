version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: medikiosk_db
    environment:
      POSTGRES_USER: medikiosk
      POSTGRES_PASSWORD: medikiosk_secret
      POSTGRES_DB: medikiosk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medikiosk"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medikiosk_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medikiosk_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://medikiosk:medikiosk_secret@db:5432/medikiosk
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: super_secret_medikiosk_key_change_in_production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      OTP_EXPIRE_MINUTES: 10
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: 20
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:3002"
      AI_PROVIDER: mock
      WHISPER_MODEL: base
      ENV: development
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - ./clinical:/app/clinical_data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medikiosk_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  uploads_data:
